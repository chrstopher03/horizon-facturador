<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Facturador | HORIZON</title>

<link rel="icon" href="1.jpeg">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

</head>

<body>

<header>

<div class="logo">

<img src="1.jpeg">

<div>

<h1>HORIZON</h1>

<p>Facturador</p>

</div>

</div>

<div class="acciones">

<button onclick="nuevaFactura()">

<i class="fa fa-plus"></i>

Nueva

</button>

</div>

</header>

<div class="container">

<div class="card">

<h2>

<i class="fa fa-user"></i>

Datos del Cliente

</h2>

<div class="grid2">

<input
type="text"
id="cliente"
placeholder="Nombre del cliente">

<input
type="text"
id="telefono"
placeholder="Número de teléfono">

</div>

<textarea
id="direccion"
placeholder="Dirección"></textarea>

</div>

<div class="card">

<h2>

<i class="fa fa-box"></i>

Agregar Producto

</h2>

<div class="grid4">

<input
type="text"
id="producto"
placeholder="Producto">

<input
type="number"
id="cantidad"
placeholder="Cantidad"
value="1">

<input
type="number"
id="precio"
placeholder="Precio">

<button onclick="agregarProducto()">

Agregar

</button>

</div>

</div>

<div class="card">

<h2>

Productos

</h2>

<table>

<thead>

<tr>

<th>Producto</th>

<th>Cant.</th>

<th>Precio</th>

<th>Total</th>

<th></th>

</tr>

</thead>

<tbody id="listaProductos">

</tbody>

</table>

<div class="totales">

<h3>

Total:

<span id="totalFactura">

C$0

</span>

</h3>

</div>

</div>

<div class="botones">

<button class="guardar" onclick="guardarVenta()">

<i class="fa fa-floppy-disk"></i>

Guardar Venta

</button>

<button class="pdf" onclick="descargarFactura()">

<i class="fa fa-file-pdf"></i>

Descargar PDF

</button>

</div>

<div class="card">

<h2>

Historial de Ventas

</h2>

<table>

<thead>

<tr>

<th>#</th>

<th>Cliente</th>

<th>Fecha</th>

<th>Total</th>

<th>PDF</th>

</tr>

</thead>

<tbody id="historial">

</tbody>

</table>

</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="script.js"></script>

</body>
</html>
